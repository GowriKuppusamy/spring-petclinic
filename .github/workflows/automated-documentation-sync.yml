name: Automated Documentation Sync

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'README.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/automated-documentation-sync.yml'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run documentation generation pipeline
        run: |
          python scripts/analyze_source.py
          python scripts/map_content.py
          python scripts/render_markdown.py --trigger-source ci

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-output
          path: docs/
